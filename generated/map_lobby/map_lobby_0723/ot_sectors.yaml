ot_interpolator:
  ros__parameters:
    n_sectors: 1
    yeet_factor: 1.25
    spline_len: 30
    ot_sector_begin: 0.5
    # global_waypoints(iqp) 412점, 트랙 길이 41.05 m -> 인덱스 0~410 이 한 바퀴
    # ot_flag 는 주행 중 rqt_reconfigure 또는
    #   ros2 param set /ot_interpolator Overtaking_sector0.ot_flag true
    # 로 켠다 (state machine 이 파라미터 변경을 구독해 즉시 반영)
    Overtaking_sector0:
      start: 0
      end: 410
      ot_flag: false
